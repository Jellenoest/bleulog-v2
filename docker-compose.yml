

services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: bluelog-frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000/api
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY}

    depends_on:
      - backend

  backend:
    build:
      context: ./server

    container_name: bluelog-backend

    restart: unless-stopped

    ports:
      - "4000:4000"

    volumes:
      - ./server/data:/app/data
      - ./server/public/uploads:/app/public/uploads